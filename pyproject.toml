[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-kg-essentials"
version = "0.1.0"
description = "Essential utilities for Endstone servers."
requires-python = ">=3.9"
dependencies = [
    "endstone",
]

[project.entry-points."endstone"]
kg-essentials = "essentials:KGEssentials"

[tool.hatch.build.targets.wheel]
packages = ["src/essentials"]

[tool.hatch.build.targets.wheel.force-include]
"resources/config.yml" = "essentials/config.yml"
"resources/message.yml" = "essentials/message.yml"
"resources/spawn.yml" = "essentials/spawn.yml"