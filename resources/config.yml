# ==================================================
# KGEssentials Configuration
# ==================================================

# Prefix used by KGEssentials messages.
prefix: "KGEssentials"

spawn:
  # Cooldown for /spawn in seconds.
  cooldown: 10
  
rtp:
  # Default maximum teleport distance.
  # Used when the player has no radius permission.
  radius: 500

  # Maximum location attempts before RTP fails.
  attempts: 32

  # Cooldown between successful RTP uses (seconds).
  cooldown: 30

  # Delay before teleporting (seconds).
  # Movement during the warmup cancels the teleport.
  warmup: 5

  # Radius granted by permission.
  # The highest radius permission owned by the player is used.
  radius-permissions:
    "kgessentials.rtp.radius.1000": 1000
    "kgessentials.rtp.radius.2500": 2500
    "kgessentials.rtp.radius.5000": 5000

  # Biomes that cannot be selected as RTP locations.
  # Use an empty list to allow all biomes.
  blacklist-biomes:
    - ocean
    - deep_ocean
    - frozen_ocean

  # RTP sound effects.
  sounds:

    # Played every second during the warmup.
    countdown:
      sound: "note.hat"
      volume: 0.25
      pitch: 1.20

    # Played after a successful teleport.
    success:
      sound: "mob.endermen.portal"
      volume: 1.00
      pitch: 1.00

    # Played when no safe location is found
    # or the teleport operation fails.
    failed:
      sound: "note.bass"
      volume: 0.70
      pitch: 0.80

    # Played when the warmup is cancelled
    # because the player moves.
    cancelled:
      sound: "note.bass"
      volume: 0.50
      pitch: 0.60