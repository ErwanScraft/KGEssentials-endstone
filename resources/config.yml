# ==================================================
# KGEssentials Configuration
# ==================================================

# Plugin prefix used in messages.
prefix: "KGEssentials"

spawn:
  # Cooldown for /spawn in seconds.
  cooldown: 10

rtp:
  # Maximum teleport radius from the player's current location.
  radius: 500

  # Maximum attempts to find a safe location.
  attempts: 32

  # Cooldown for /rtp in seconds.
  cooldown: 30