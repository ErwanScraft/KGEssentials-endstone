# ==================================================
# KGEssentials Configuration
# ==================================================

# Plugin prefix used in messages.
prefix: "KGEssentials"

spawn:
  # Cooldown for /spawn in seconds.
  cooldown: 10

# Random teleportation settings.
rtp:
  # Maximum teleportation radius from the player's current position.
  radius: 500

  # Number of location attempts before RTP fails.
  attempts: 32

  # Cooldown between RTP uses, in seconds.
  cooldown: 30

  # Delay before teleportation, in seconds.
  # Movement during warmup cancels the teleport.
  warmup: 5

  # Biomes where RTP locations are not allowed.
  blacklist-biomes:
    - ocean
    - deep_ocean
    - frozen_ocean